name: Feature request
description: Suggest an enhancement or new capability
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For **new translation providers** or **fonts**, see the checklists in [CONTRIBUTING.md](https://github.com/kiriuru/Kagevi-Subtitles/blob/main/CONTRIBUTING.md).
        Large features land more smoothly if you open an issue before a big PR.
  - type: dropdown
    id: kind
    attributes:
      label: Request type
      options:
        - Translation provider
        - Subtitle font
        - ASR / recognition
        - Overlay / OBS
        - TTS / Twitch
        - Dashboard UX
        - Docs / localization
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Links to APIs, fonts, or mockups help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — other approaches you already tried or rejected.
  - type: checkboxes
    id: contrib
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR following CONTRIBUTING.md
        - label: I searched existing issues / discussions for duplicates
          required: true
