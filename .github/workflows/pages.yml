name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "Images/**"
      - "docs/WIKI.en.md"
      - "docs/WIKI.ru.md"
      - "docs/CHANGELOG.en.md"
      - "docs/CHANGELOG.md"
      - "scripts/build-site.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build presentation site
        run: npm run pages:build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Unique name per attempt — re-runs otherwise leave a second "github-pages"
      # artifact on the same run and actions/deploy-pages aborts.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
